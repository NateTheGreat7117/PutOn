<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posts</title>
    <style rel="stylesheet" href="/assets/css/all-posts.css"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="tab-switcher">
                <button class="tab-button active" data-tab="posts">My Posts</button>
                <button class="tab-button" data-tab="liked">Liked</button>
                <button class="tab-button" data-tab="saved">Saved</button>
                <button class="tab-button" data-tab="reposted">Reposted</button>
            </div>

            <div class="posts-count">
                <span id="postsCount">0 posts</span>
            </div>
        </div>

        <div class="posts-grid" id="postsGrid">
            <div class="loading">Loading posts...</div>
        </div>
    </div>

    <script src="all-posts.js"></script>
</body>
</html>
